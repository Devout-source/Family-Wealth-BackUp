    <script>
      (function() {
        // 1. Intercept and swallow third-party extension errors (e.g. Urban VPN / proxy interceptors)
        window.addEventListener('error', function(event) {
          var isExtension = event.filename && event.filename.indexOf('chrome-extension://') !== -1;
          var isFetchGetter = event.message && (event.message.indexOf('fetch') !== -1 || event.message.indexOf('getter') !== -1);
          if (isExtension || isFetchGetter) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack)) || String(reason || '');
          if (msg.indexOf('chrome-extension://') !== -1 || msg.indexOf('fetch') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // 2. Ensure window.fetch and Window.prototype.fetch have both getter and setter so any extension setting window.fetch = ... never crashes
        try {
          var originalFetch = window.fetch;
          var activeFetch = originalFetch;
          function safeFetch() {
            var target = activeFetch || originalFetch;
            return target.apply(window, arguments);
          }
          try {
            for (var key in originalFetch) {
              safeFetch[key] = originalFetch[key];
            }
          } catch(e) {}

          try {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return activeFetch || safeFetch;
              },
              set: function(val) {
                activeFetch = val;
              }
            });
          } catch(e1) {}

          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return activeFetch || safeFetch;
                },
                set: function(val) {
                  activeFetch = val;
                }
              });
            }
          } catch (e2) {}
        } catch (eGlobal) {}
      })();
    </script>
